---
name: Publish container

on:
  push:
    branches:
      - "deploy/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  publish:
    if: github.repository == 'NullRefExcep/headscale'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: Set commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and push
        env:
          CGO_ENABLED: "0"
          KO_DEFAULTBASEIMAGE: gcr.io/distroless/base-debian13
          KO_DOCKER_REPO: ghcr.io/nullrefexcep/headscale
        run: |
          image_tag="${GITHUB_REF_NAME#deploy/}"
          ko build \
            --bare \
            --image-annotation=org.opencontainers.image.source=https://github.com/NullRefExcep/headscale \
            --image-label=org.opencontainers.image.source=https://github.com/NullRefExcep/headscale \
            --image-label=org.opencontainers.image.revision="${GITHUB_SHA}" \
            --image-label=org.opencontainers.image.licenses=BSD-3-Clause \
            --platform=linux/amd64,linux/arm64 \
            --tags="${image_tag},sha-${GITHUB_SHA::7}" \
            ./cmd/headscale
